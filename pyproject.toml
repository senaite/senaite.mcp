[project]
name = "senaite.mcp"
version = "0.1.0"
description = "MCP server exposing the SENAITE JSON API to agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv2" }
authors = [{ name = "Ramon Bartl", email = "rb@ridingbytes.com" }]
keywords = ["senaite", "lims", "mcp", "jsonapi"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
senaite-mcp = "senaite_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senaite_mcp"]
